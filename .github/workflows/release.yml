name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_AI_GATEWAY_ORIGIN: ${{ vars.VITE_AI_GATEWAY_ORIGIN }}
      VITE_FIREBASE_ALLOW_REGISTRATION: 'false'
      VITE_FIREBASE_USE_EMULATORS: 'false'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Production build preflight
        run: npm run preflight:release
      - run: npm run check
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore Security Rules tests
        run: npm run test:firebase-emulator
      - name: Package stable extension
        env:
          RELEASE_CHANNEL: stable
          RELEASE_APPROVED: ${{ vars.RELEASE_APPROVED }}
        run: npm run package:extension
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/*.zip
            release/*.sha256
            release/*.json
          generate_release_notes: true
