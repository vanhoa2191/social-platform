name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore Security Rules tests
        run: npm run test:firebase-emulator
      - name: Package beta extension artifact
        env:
          RELEASE_CHANNEL: beta
        run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: autotool-extension-beta
          path: |
            release/*.zip
            release/*.sha256
            release/*.json
          if-no-files-found: error
